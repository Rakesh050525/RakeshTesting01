<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopping Cart Demo</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <header class="hero">
        <h1 class="logo">ShopSpark</h1>
        <p class="tag">A colorful shopping cart demo with animations</p>
        <div class="controls">
          <label>Sort:</label>
          <label class="radio"><input type="radio" name="sort" value="default" checked> Default</label>
          <label class="radio"><input type="radio" name="sort" value="low"> Price: Low → High</label>
          <label class="radio"><input type="radio" name="sort" value="high"> Price: High → Low</label>
        </div>
      </header>

      <main>
        <section>
          <h2>Products</h2>
          <div id="products" class="products"></div>
        </section>

        <aside>
          <h2>Your Cart</h2>
          <div id="cart" class="cart"></div>
          <button id="checkout" class="checkout">Checkout</button>
        </aside>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
